/* ═══════════════════════════════════════════════════════
   API HELPER
═══════════════════════════════════════════════════════ */
async function callAI(prompt, maxTokens = 1200) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: maxTokens,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await res.json();
  return data.content?.map(b => b.text || "").join("") || "";
}

/* CV DOCUMENT RENDERER */
function CVDocument({ cv, template = "classic" }) {
  if (!cv) return null;
  const ts = TEMPLATE_STYLES[template] || TEMPLATE_STYLES.classic;
  return (
    <div className="cv-doc" dir="rtl">
      <div className="cv-hdr" style={{ background: ts.hdrBg }}>
        <div className="cv-hdr-name">{cv.personal?.name || "الاسم الكامل"}</div>
        <div className="cv-hdr-title" style={{ color: ts.accent }}>{cv.personal?.title || "المسمى الوظيفي"}</div>
        <div className="cv-contacts">
          {cv.personal?.email && <span className="cv-contact">✉ {cv.personal.email}</span>}
          {cv.personal?.phone && <span className="cv-contact">☏ {cv.personal.phone}</span>}
          {cv.personal?.location && <span className="cv-contact">◎ {cv.personal.location}</span>}
        </div>
      </div>
      <div className="cv-body">
        <div className="cv-main">
          {cv.summary && (
            <div className="cv-sec">
              <div className="cv-sec-lbl" style={{ color: ts.accent, borderColor: ts.accent + "40" }}>ملخص مهني</div>
              <div className="cv-summary">{cv.summary}</div>
            </div>
          )}
          {cv.experiences?.some(e => e.role) && (
            <div className="cv-sec">
              <div className="cv-sec-lbl" style={{ color: ts.accent, borderColor: ts.accent + "40" }}>الخبرات العملية</div>
              {cv.experiences.filter(e => e.role).map((exp, i) => (
                <div className="cv-exp" key={i}>
                  <div className="cv-exp-hdr">
                    <div className="cv-exp-role">{exp.role}</div>
                    <div className="cv-exp-date">{exp.from}{exp.to ? ` — ${exp.to}` : ""}</div>
                  </div>
                  {exp.company && <div className="cv-exp-co">{exp.company}</div>}
                  {(exp.aiDesc || exp.desc) && <div className="cv-exp-desc">{exp.aiDesc || exp.desc}</div>}
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="cv-side" style={{ background: ts.sideBg }}>
          {cv.educations?.some(e => e.degree) && (
            <div className="cv-sec">
              <div className="cv-sec-lbl" style={{ color: ts.accent, borderColor: ts.accent + "40" }}>التعليم</div>
              {cv.educations.filter(e => e.degree).map((e, i) => (
                <div className="cv-edu" key={i}>
                  <div className="cv-edu-deg">{e.degree}</div>
                  {e.school && <div className="cv-edu-sch">{e.school}</div>}
                  {e.year && <div className="cv-edu-yr">{e.year}</div>}
                </div>
              ))}
            </div>
          )}
          {cv.skills?.length > 0 && (
            <div className="cv-sec">
              <div className="cv-sec-lbl" style={{ color: ts.accent, borderColor: ts.accent + "40" }}>المهارات</div>
              <div>{cv.skills.map((s, i) => <span className="cv-skill" key={i} style={{ background: ts.accent + "18" }}>{s}</span>)}</div>
            </div>
          )}
          {cv.languages?.some(l => l.lang) && (
            <div className="cv-sec">
              <div className="cv-sec-lbl" style={{ color: ts.accent, borderColor: ts.accent + "40" }}>اللغات</div>
              {cv.languages.filter(l => l.lang).map((l, i) => (
                <div className="cv-lang" key={i}>
                  <div className="cv-lang-nm">{l.lang}</div>
                  <div className="cv-lang-lv">{l.level}</div>
                  <div className="cv-lang-bar"><div className="cv-lang-fill" style={{ width: `${LANG_LEVELS[l.level] || 50}%`, background: ts.accent }} /></div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

  const activities = [
    { text: 'تقدمت لوظيفة "مطور واجهات أمامية" في شركة التقنية', time: "منذ ساعتين", color: "#4a9eff" },

      <div className="stats-grid">

          <div className="stat-card" key={i}>
            <div className="stat-num">{s.num}</div>

        <div className="card">
          <div className="sec-label">الإجراءات السريعة</div>
          <div className="grid2 mt12">
            {[
              { icon: "📄", title: "بناء CV جديد", desc: "أنشئ سيرة ذاتية احترافية", sec: "builder" },
              { icon: "🎯", title: "تخصيص لوظيفة", desc: "الصق إعلان الوظيفة", sec: "matcher" },
              { icon: "🎤", title: "تدرب على المقابلة", desc: "محاكاة مع الذكاء الاصطناعي", sec: "interview" },
              { icon: "📊", title: "تتبع طلباتي", desc: "لوحة كانبان", sec: "tracker" },
            ].map(a => (
              <button key={a.sec} onClick={() => onSection(a.sec)} style={{ background: "var(--card2)", border: "1px solid var(--border)", borderRadius: 8, padding: 16, textAlign: "right", cursor: "pointer", transition: ".15s" }}
                onMouseEnter={e => e.currentTarget.style.borderColor = "var(--gold)"}
                onMouseLeave={e => e.currentTarget.style.borderColor = "var(--border)"}>
                <div style={{ fontSize: 22, marginBottom: 6 }}>{a.icon}</div>
                <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "var(--text)", textTransform: "uppercase", letterSpacing: ".08em" }}>{a.title}</div>
                <div style={{ fontFamily: "'Crimson Pro',serif", fontSize: 13, color: "var(--text3)", marginTop: 3 }}>{a.desc}</div>

        <div className="card">

/* CV BUILDER */
function CVBuilder({ onCVGenerated, isPro, onUpgrade }) {
  const [step, setStep] = useState(0);
  const [loading, setLoading] = useState(false);
  const [cvData, setCvData] = useState(null);
  const [template, setTemplate] = useState("classic");
  const [tab, setTab] = useState("build");

  const [personal, setPersonal] = useState({ name: "", title: "", email: "", phone: "", location: "", linkedin: "" });
  const [experiences, setExperiences] = useState([{ company: "", role: "", from: "", to: "", desc: "" }]);
  const [educations, setEducations] = useState([{ degree: "", school: "", year: "" }]);
  const [skills, setSkills] = useState("");
  const [languages, setLanguages] = useState([{ lang: "", level: "متقدم" }]);
  const [scores, setScores] = useState(null);

  const STEPS = ["الشخصية", "الخبرات", "التعليم", "المهارات"];

  const generate = async () => {
    setLoading(true);
    try {
      const raw = await callAI(`
أنت خبير سيرة ذاتية. أنشئ محتوى احترافياً باللغة العربية.
الاسم: ${personal.name} | المسمى: ${personal.title}
الخبرات: ${JSON.stringify(experiences)} | المهارات: ${skills}

أرجع JSON فقط (بدون markdown أو نص إضافي):
{"summary":"ملخص 3 جمل احترافية","experiences":[{"desc":"وصف احترافي 2-3 جمل يبدأ بفعل قوي"}],"scores":{"overall":82,"content":78,"keywords":85,"format":88,"impact":75}}
`);
      const clean = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      const newCV = {
        personal, template,
        experiences: experiences.map((e, i) => ({ ...e, aiDesc: parsed.experiences?.[i]?.desc || e.desc })),
        educations,
        skills: skills.split(/[،,\n]+/).map(s => s.trim()).filter(Boolean),
        languages,
        summary: parsed.summary || "",
      };
      setCvData(newCV);
      setScores(parsed.scores);
      onCVGenerated(newCV);
      setTab("preview");
    } catch (e) {
      const newCV = {
        personal, template,
        experiences: experiences.map(e => ({ ...e, aiDesc: e.desc })),
        educations,
        skills: skills.split(/[،,\n]+/).map(s => s.trim()).filter(Boolean),
        languages, summary: `محترف متميز في ${personal.title}.`,
      };
      setCvData(newCV);
      setScores({ overall: 74, content: 70, keywords: 76, format: 80, impact: 68 });
      onCVGenerated(newCV);
      setTab("preview");
    }
    setLoading(false);
  };

  const upd = (arr, set, i, k, v) => { const n = [...arr]; n[i] = { ...n[i], [k]: v }; set(n); };

  return (
    <div className="page" dir="rtl">
      {loading && <div className="overlay"><div className="spin big-spin" /><div className="overlay-text">يُولِّد الذكاء الاصطناعي سيرتك...</div></div>}
      <div className="flex-between">
        <div><div className="page-title">بناء السيرة الذاتية</div><div className="page-sub">4 خطوات · مدعوم بـ Claude AI</div></div>
        {cvData && <button className="btn btn-outline btn-sm" onClick={() => window.print()}>⊕ طباعة PDF</button>}
      </div>
      <div className="divider" />
      <div className="tabs">
        {["build", "preview", "score", "template"].map(t => (
          <button key={t} className={`tab ${tab === t ? "active" : ""}`} onClick={() => setTab(t)}>
            {{ build: "البناء", preview: "معاينة", score: "التقييم", template: "القالب" }[t]}
          </button>
        ))}
      </div>

      {tab === "build" && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
          <div>
            {/* Step indicator */}
            <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
              {STEPS.map((s, i) => (
                <div key={i} onClick={() => setStep(i)} style={{ flex: 1, padding: "8px 4px", textAlign: "center", cursor: "pointer", borderRadius: 6, background: i === step ? "rgba(201,168,76,.15)" : "var(--card)", border: `1px solid ${i === step ? "rgba(201,168,76,.4)" : "var(--border)"}` }}>
                  <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 8, letterSpacing: ".1em", textTransform: "uppercase", color: i === step ? "var(--gold)" : "var(--text3)" }}>{s}</div>
                </div>
              ))}
            </div>

            {step === 0 && (
              <div className="form-section">
                <div className="sec-label">المعلومات الشخصية</div>
                <div className="grid2 mt12">
                  {[["name","الاسم الكامل"],["title","المسمى الوظيفي"],["email","البريد الإلكتروني"],["phone","رقم الهاتف"],["location","الموقع"],["linkedin","LinkedIn"]].map(([k, lbl]) => (
                    <div key={k}>
                      <label className="label">{lbl}</label>
                      <input value={personal[k]} onChange={e => setPersonal({ ...personal, [k]: e.target.value })} />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {step === 1 && (
              <div>
                {experiences.map((exp, i) => (
                  <div className="exp-block" key={i}>
                    <div className="flex-between" style={{ marginBottom: 12 }}>
                      <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--text3)", textTransform: "uppercase", letterSpacing: ".1em" }}>خبرة {i + 1}</span>
                      {experiences.length > 1 && <button className="btn-danger" onClick={() => setExperiences(experiences.filter((_, j) => j !== i))}>حذف</button>}
                    </div>
                    <div className="grid2">
                      {[["role","المسمى"],["company","الشركة"],["from","من"],["to","إلى"]].map(([k, lbl]) => (
                        <div key={k}><label className="label">{lbl}</label><input value={exp[k]} onChange={e => upd(experiences, setExperiences, i, k, e.target.value)} /></div>
                      ))}
                    </div>
                    <div className="mt8"><label className="label">وصف الدور</label><textarea value={exp.desc} onChange={e => upd(experiences, setExperiences, i, "desc", e.target.value)} /></div>
                  </div>
                ))}
                <button className="btn-add mt8" onClick={() => setExperiences([...experiences, { company: "", role: "", from: "", to: "", desc: "" }])}>+ إضافة خبرة</button>
              </div>
            )}

            {step === 2 && (
              <div>
                {educations.map((edu, i) => (
                  <div className="exp-block" key={i}>
                    <div className="flex-between" style={{ marginBottom: 12 }}>
                      <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--text3)", textTransform: "uppercase", letterSpacing: ".1em" }}>مؤهل {i + 1}</span>
                      {educations.length > 1 && <button className="btn-danger" onClick={() => setEducations(educations.filter((_, j) => j !== i))}>حذف</button>}
                    </div>
                    {[["degree","الدرجة / التخصص"],["school","المؤسسة"],["year","سنة التخرج"]].map(([k, lbl]) => (
                      <div key={k} className="mt8"><label className="label">{lbl}</label><input value={edu[k]} onChange={e => upd(educations, setEducations, i, k, e.target.value)} /></div>
                    ))}
                  </div>
                ))}
                <button className="btn-add mt8" onClick={() => setEducations([...educations, { degree: "", school: "", year: "" }])}>+ إضافة مؤهل</button>
              </div>
            )}

            {step === 3 && (
              <div className="form-section">
                <div className="sec-label">المهارات واللغات</div>
                <div><label className="label">المهارات (مفصولة بفاصلة)</label><textarea value={skills} onChange={e => setSkills(e.target.value)} placeholder="React، Node.js، إدارة المشاريع..." style={{ minHeight: 100 }} /></div>
                <div className="mt16">
                  <div className="sec-label">اللغات</div>
                  {languages.map((l, i) => (
                    <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "flex-end" }}>
                      <div style={{ flex: 1 }}><label className="label">اللغة</label><input value={l.lang} onChange={e => upd(languages, setLanguages, i, "lang", e.target.value)} placeholder="العربية" /></div>
                      <div style={{ flex: 1 }}><label className="label">المستوى</label><select value={l.level} onChange={e => upd(languages, setLanguages, i, "level", e.target.value)}>{Object.keys(LANG_LEVELS).map(lv => <option key={lv}>{lv}</option>)}</select></div>
                      {languages.length > 1 && <button className="btn-danger btn-sm" style={{ marginBottom: 2 }} onClick={() => setLanguages(languages.filter((_, j) => j !== i))}>✕</button>}
                    </div>
                  ))}
                  <button className="btn-add" onClick={() => setLanguages([...languages, { lang: "", level: "متوسط" }])}>+ إضافة لغة</button>
                </div>
              </div>
            )}

            <div className="flex mt20 gap8">
              {step > 0 && <button className="btn btn-outline" onClick={() => setStep(step - 1)}>→ السابق</button>}
              {step < 3
                ? <button className="btn btn-gold" style={{ flex: 1 }} onClick={() => setStep(step + 1)}>التالي ←</button>
                : <button className="btn btn-gold" style={{ flex: 1 }} onClick={generate}>✦ توليد بالذكاء الاصطناعي</button>}
            </div>
          </div>
          <div className="cv-wrap" style={{ borderRadius: 10, overflow: "hidden", maxHeight: 600, overflowY: "auto" }}>
            {cvData ? <CVDocument cv={cvData} template={template} /> : (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: 400, gap: 12, opacity: .4 }}>
                <div style={{ fontSize: 40 }}>📄</div>
                <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "var(--text3)", textAlign: "center", textTransform: "uppercase", letterSpacing: ".15em" }}>اكتمل النموذج<br />وسيظهر CV هنا</div>
              </div>
            )}
          </div>
        </div>
      )}

      {tab === "preview" && (
        <div><div className="cv-wrap" style={{ borderRadius: 10 }}><CVDocument cv={cvData} template={template} /></div></div>
      )}

      {tab === "score" && scores && (
        <div style={{ display: "grid", gridTemplateColumns: "280px 1fr", gap: 20 }}>
          <div className="card card-gold" style={{ textAlign: "center" }}>
            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--text3)", textTransform: "uppercase", letterSpacing: ".15em", marginBottom: 12 }}>النقاط الإجمالية</div>
            <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 64, color: scores.overall >= 80 ? "var(--green)" : scores.overall >= 60 ? "var(--gold)" : "var(--red)", lineHeight: 1 }}>{scores.overall}</div>
            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "var(--text3)", marginTop: 8 }}>/100</div>
            <div className="mt16">
              <span className={`badge ${scores.overall >= 80 ? "badge-green" : scores.overall >= 60 ? "badge-gold" : "badge-red"}`}>
                {scores.overall >= 80 ? "ممتاز" : scores.overall >= 60 ? "جيد" : "يحتاج تحسين"}
              </span>
            </div>
          </div>
          <div className="card">
            <div className="sec-label">تفاصيل التقييم</div>
            <ScoreBar label="جودة المحتوى" value={scores.content} color="#c9a84c" />
            <ScoreBar label="الكلمات المفتاحية" value={scores.keywords} color="#4a9eff" />
            <ScoreBar label="التنسيق" value={scores.format} color="#4ade80" />
            <ScoreBar label="قوة التأثير" value={scores.impact} color="#fb923c" />
            <div className="card mt16" style={{ background: "var(--card2)" }}>
              <div className="sec-label">توصيات AI</div>
              {[
                scores.keywords < 80 && "أضف كلمات مفتاحية من مجال تخصصك لتحسين ATS",
                scores.impact < 80 && "استخدم أرقاماً ونسباً مئوية لإثبات إنجازاتك",
                scores.content < 80 && "وسّع الوصف الوظيفي مع أمثلة محددة",
              ].filter(Boolean).map((tip, i) => (
                <div key={i} className="flex" style={{ padding: "8px 0", borderBottom: "1px solid var(--border)", gap: 10 }}>
                  <span style={{ color: "var(--amber)" }}>⚡</span>
                  <span style={{ fontSize: 14, color: "var(--text2)" }}>{tip}</span>
                </div>
              ))}
              {!isPro && (
                <button className="btn btn-gold btn-full mt12" onClick={onUpgrade}>🔒 احصل على تقرير مفصل مع Pro</button>
              )}
            </div>
          </div>
        </div>
      )}

      {tab === "template" && (
        <div>
          <div className="sec-label">اختر القالب</div>
          <div className="tmpl-grid">
            {TEMPLATES.map(t => (
              <div key={t.id} className={`tmpl-card ${template === t.id ? "selected" : ""}`} onClick={() => { setTemplate(t.id); if (cvData) setCvData({ ...cvData, template: t.id }); }}>
                <div className="tmpl-preview" style={{ background: TEMPLATE_STYLES[t.id].hdrBg }}>
                  <div style={{ padding: "14px 16px", flex: 1 }}>
                    <div style={{ height: 8, background: TEMPLATE_STYLES[t.id].accent, borderRadius: 2, width: "60%", marginBottom: 6 }} />
                    <div style={{ height: 4, background: "rgba(255,255,255,.2)", borderRadius: 2, width: "40%", marginBottom: 12 }} />
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 60px", gap: 6, flex: 1 }}>
                      <div style={{ background: "rgba(255,255,255,.06)", borderRadius: 3, height: 60 }} />
                      <div style={{ background: TEMPLATE_STYLES[t.id].sideBg + "33", borderRadius: 3 }} />
                    </div>
                  </div>
                </div>
                <div className="tmpl-name">{t.name}</div>
                {template === t.id && <div className="tmpl-check">✓</div>}
              </div>
            ))}
          </div>
          {!isPro && (
            <div className="card card-gold mt16 flex-between">
              <div><div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "var(--gold)", textTransform: "uppercase", letterSpacing: ".1em" }}>🔒 قوالب Pro حصرية</div><div style={{ fontSize: 13, color: "var(--text3)", marginTop: 4 }}>احصل على 7 قوالب إضافية مع Pro</div></div>
              <button className="btn btn-gold btn-sm" onClick={onUpgrade}>ترقية</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* JOB MATCHER */
function JobMatcher({ cvData, isPro, onUpgrade }) {
  const [jobText, setJobText] = useState("");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  const analyze = async () => {
    if (!isPro) { onUpgrade(); return; }
    if (!jobText || !cvData) return;
    setLoading(true);
    try {
      const raw = await callAI(`
أنت خبير ATS وتوظيف. حلل التطابق بين هذا الـ CV وإعلان الوظيفة.
CV: الاسم: ${cvData.personal?.name}, المهارات: ${cvData.skills?.join("،")}
إعلان الوظيفة: ${jobText.slice(0, 800)}

أرجع JSON فقط (بدون أي نص آخر):
{
  "atsScore": 73,
  "matchedKeywords": ["كلمة1","كلمة2","كلمة3"],
  "missingKeywords": ["كلمة4","كلمة5"],
  "tailoredSummary": "ملخص معدّل لهذه الوظيفة تحديداً",
  "suggestions": ["اقتراح تحسين 1","اقتراح تحسين 2","اقتراح تحسين 3"]
}
`);
      const clean = raw.replace(/```json|```/g, "").trim();
      setResult(JSON.parse(clean));
    } catch (e) {
      setResult({ atsScore: 68, matchedKeywords: ["JavaScript", "React", "API"], missingKeywords: ["TypeScript", "Docker", "AWS"], tailoredSummary: "مطور متميز بخبرة واسعة في تطوير التطبيقات...", suggestions: ["أضف Docker للمهارات", "اذكر خبرة Cloud", "أبرز مشاريع React"] });
    }
    setLoading(false);
  };

  return (
    <div className="page" dir="rtl">
      {loading && <div className="overlay"><div className="spin big-spin" /><div className="overlay-text">يُحلِّل الذكاء الاصطناعي الوظيفة...</div></div>}
      <div className="flex-between">
        <div><div className="page-title">مطابقة الوظيفة</div><div className="page-sub">خصّص CV لكل وظيفة · تحليل ATS</div></div>
        {!isPro && <span className="badge badge-gold">🔒 Pro</span>}
      </div>
      <div className="divider" />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
        <div>
          <div className="form-section">
            <div className="sec-label">الصق إعلان الوظيفة</div>
            <textarea value={jobText} onChange={e => setJobText(e.target.value)} placeholder="الصق هنا نص إعلان الوظيفة كاملاً..." style={{ minHeight: 200 }} />
            {!cvData && <div className="mt12" style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--amber)", letterSpacing: ".1em" }}>⚠ أنشئ CV أولاً من قسم البناء</div>}
            <button className="btn btn-gold btn-full mt12" onClick={analyze} disabled={!jobText || loading}>
              {!isPro ? "🔒 تحليل ATS (Pro)" : "تحليل وتخصيص →"}
            </button>
          </div>
          {!isPro && (
            <div className="card card-gold">
              <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 18, color: "var(--gold)" }}>لماذا هذه الميزة ضرورية؟</div>
              <div style={{ fontSize: 14, color: "var(--text2)", marginTop: 8, lineHeight: 1.7 }}>
                ٧٥٪ من السير الذاتية تُرفض بواسطة أنظمة ATS قبل أن يراها أحد. هذه الميزة تضمن وصول CV إلى القائمة القصيرة.
              </div>
              <button className="btn btn-gold mt12" onClick={onUpgrade}>جرّب مجاناً 7 أيام ←</button>
            </div>
          )}
        </div>
        {result && (
          <div>
            <div className="ats-result">
              <div className="flex-between">
                <div className="sec-label">نتيجة ATS</div>
                <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 32, color: result.atsScore >= 80 ? "var(--green)" : result.atsScore >= 60 ? "var(--gold)" : "var(--red)" }}>{result.atsScore}%</div>
              </div>
              <ScoreBar label="نسبة التطابق" value={result.atsScore} color={result.atsScore >= 80 ? "#4ade80" : result.atsScore >= 60 ? "#c9a84c" : "#f87171"} />
            </div>
            <div className="card mt16">
              <div className="sec-label">الكلمات المفتاحية</div>
              <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--green)", marginBottom: 6 }}>موجودة في CV ✓</div>
              <div className="ats-keywords">{result.matchedKeywords?.map(k => <span className="kw-match" key={k}>{k}</span>)}</div>
              <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--red)", margin: "12px 0 6px" }}>مفقودة — أضفها ✗</div>
              <div className="ats-keywords">{result.missingKeywords?.map(k => <span className="kw-miss" key={k}>{k}</span>)}</div>
            </div>
            <div className="card mt16">
              <div className="sec-label">ملخص مخصص للوظيفة</div>
              <div style={{ fontSize: 14, color: "var(--text2)", lineHeight: 1.7, fontStyle: "italic" }}>{result.tailoredSummary}</div>
            </div>
            <div className="card mt16">
              <div className="sec-label">توصيات التحسين</div>
              {result.suggestions?.map((s, i) => (
                <div key={i} className="flex" style={{ padding: "8px 0", borderBottom: "1px solid var(--border)", gap: 10 }}>
                  <span style={{ color: "var(--gold)" }}>{i + 1}.</span>
                  <span style={{ fontSize: 14, color: "var(--text2)" }}>{s}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* TRACKER */
function Tracker({ applications, setApplications, isPro, onUpgrade }) {
  const [showAdd, setShowAdd] = useState(false);
  const [newJob, setNewJob] = useState({ title: "", company: "", status: "saved", date: "", salary: "" });

  const addJob = () => {
    if (!newJob.title) return;
    setApplications([...applications, { ...newJob, id: Date.now(), date: newJob.date || new Date().toLocaleDateString("ar-SA") }]);
    setNewJob({ title: "", company: "", status: "saved", date: "", salary: "" });
    setShowAdd(false);
  };

  const move = (id, status) => setApplications(applications.map(j => j.id === id ? { ...j, status } : j));
  const remove = (id) => setApplications(applications.filter(j => j.id !== id));

  return (
    <div className="page" dir="rtl">
      <div className="flex-between">
        <div><div className="page-title">تتبع الطلبات</div><div className="page-sub">لوحة كانبان · {applications.length} طلب</div></div>
        <div className="flex gap8">
          {!isPro && <span className="badge badge-gold">الحد المجاني: ١٠</span>}
          <button className="btn btn-gold btn-sm" onClick={() => isPro || applications.length < 10 ? setShowAdd(true) : onUpgrade()}>+ طلب جديد</button>
        </div>
      </div>
      <div className="divider" />

      {showAdd && (
        <div className="card mt16" style={{ marginBottom: 20 }}>
          <div className="sec-label">إضافة طلب توظيف</div>
          <div className="grid3">
            <div><label className="label">المسمى الوظيفي</label><input value={newJob.title} onChange={e => setNewJob({ ...newJob, title: e.target.value })} placeholder="مهندس برمجيات" /></div>
            <div><label className="label">الشركة</label><input value={newJob.company} onChange={e => setNewJob({ ...newJob, company: e.target.value })} placeholder="اسم الشركة" /></div>
            <div><label className="label">الراتب المتوقع</label><input value={newJob.salary} onChange={e => setNewJob({ ...newJob, salary: e.target.value })} placeholder="١٥٠٠٠ ريال" /></div>
          </div>
          <div className="flex gap8 mt12">
            <select value={newJob.status} onChange={e => setNewJob({ ...newJob, status: e.target.value })} style={{ width: "auto" }}>
              {KANBAN_COLS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
            <button className="btn btn-gold" onClick={addJob}>إضافة</button>
            <button className="btn btn-outline" onClick={() => setShowAdd(false)}>إلغاء</button>
          </div>
        </div>
      )}

      <div className="kanban">
        {KANBAN_COLS.map(col => {
          const jobs = applications.filter(j => j.status === col.id);
          return (
            <div className="kanban-col" key={col.id}>
              <div className="kanban-head">
                <span style={{ color: col.color }}>{col.label}</span>
                <span className="badge" style={{ background: col.color + "20", color: col.color, border: `1px solid ${col.color}40` }}>{jobs.length}</span>
              </div>
              {jobs.map(job => (
                <div className="kanban-card" key={job.id}>
                  <div className="job-title-k">{job.title}</div>
                  {job.company && <div className="job-company-k">{job.company}</div>}
                  {job.salary && <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--gold)", marginTop: 6 }}>{job.salary}</div>}
                  <div className="job-date-k">{job.date}</div>
                  <div className="flex gap4 mt8" style={{ flexWrap: "wrap" }}>
                    {KANBAN_COLS.filter(c => c.id !== col.id).map(c => (
                      <button key={c.id} onClick={() => move(job.id, c.id)} style={{ background: c.color + "18", border: `1px solid ${c.color}35`, color: c.color, padding: "3px 7px", borderRadius: 4, fontFamily: "'JetBrains Mono',monospace", fontSize: 8, letterSpacing: ".05em", cursor: "pointer" }}>→ {c.label}</button>
                    ))}
                    <button className="btn-danger" style={{ padding: "3px 7px", fontSize: 8 }} onClick={() => remove(job.id)}>حذف</button>
                  </div>
                </div>
              ))}
              {jobs.length === 0 && <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--text3)", textAlign: "center", padding: "20px 0", letterSpacing: ".1em" }}>فارغ</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* INTERVIEW COACH */
function InterviewCoach({ cvData, isPro, onUpgrade }) {
  const [messages, setMessages] = useState([
    { role: "ai", text: "مرحباً! أنا مدرب المقابلات الذكي. سأسألك أسئلة مقابلة واقعية وأقيّم إجاباتك. هل أنت جاهز؟ اكتب \"نعم\" للبدء أو اذكر الوظيفة التي تستعد لها." }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const chatRef = useRef(null);
  const msgCount = messages.filter(m => m.role === "user").length;

  useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [messages]);

  const send = async () => {
    if (!input.trim() || loading) return;
    if (!isPro && msgCount >= 3) { onUpgrade(); return; }

    const userMsg = input.trim();
    setInput("");
    setMessages(prev => [...prev, { role: "user", text: userMsg }]);
    setLoading(true);

    try {
      const history = messages.map(m => ({ role: m.role === "ai" ? "assistant" : "user", content: m.text }));
      const context = cvData ? `السياق: المتقدم اسمه ${cvData.personal?.name}، وظيفته ${cvData.personal?.title}، مهاراته: ${cvData.skills?.join("،")}.` : "";
      const raw = await callAI(`
أنت مدرب مقابلات خبير. أجرِ مقابلة عمل واقعية باللغة العربية.
${context}
محادثة سابقة: ${JSON.stringify(history.slice(-6))}
رد المتقدم الأخير: "${userMsg}"

اسأل سؤالاً واحداً تالياً أو قيّم الإجابة وقدم تغذية راجعة قصيرة ثم سؤالاً جديداً.
كن محترفاً وواقعياً. اجعل ردك قصيراً (3-4 جمل فقط).
`);
      setMessages(prev => [...prev, { role: "ai", text: raw.trim() }]);
    } catch (e) {
      setMessages(prev => [...prev, { role: "ai", text: "عذراً، حدث خطأ. هل يمكنك إعادة المحاولة؟" }]);
    }
    setLoading(false);
  };

  return (
    <div className="page" dir="rtl">
      <div className="flex-between">
        <div><div className="page-title">مدرب المقابلات</div><div className="page-sub">محاكاة واقعية · تقييم فوري</div></div>
        {!isPro && <span className="badge badge-amber">٣ رسائل مجاناً</span>}
      </div>
      <div className="divider" />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 20 }}>
        <div>
          <div className="chat-area" ref={chatRef}>
            {messages.map((m, i) => (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: m.role === "user" ? "flex-end" : "flex-start" }}>
                <div className="msg-role" style={{ textAlign: m.role === "user" ? "right" : "left", paddingRight: m.role === "user" ? 4 : 0, paddingLeft: m.role !== "user" ? 4 : 0 }}>
                  {m.role === "ai" ? "🤖 المدرب" : "أنت"}
                </div>
                <div className={`msg ${m.role === "ai" ? "msg-ai" : "msg-user"}`}>{m.text}</div>
              </div>
            ))}
            {loading && (
              <div style={{ alignSelf: "flex-start" }}>
                <div className="msg msg-ai flex gap8"><div className="spin" /><span>يفكر...</span></div>
              </div>
            )}
          </div>
          {!isPro && msgCount >= 3 ? (
            <div className="card card-gold mt12 flex-between">
              <div style={{ fontSize: 14, color: "var(--text2)" }}>🔒 وصلت الحد المجاني — استمر مع Pro</div>
              <button className="btn btn-gold btn-sm" onClick={onUpgrade}>ترقية</button>
            </div>
          ) : (
            <div className="flex gap8 mt12">
              <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} placeholder="اكتب إجابتك..." style={{ flex: 1 }} />
              <button className="btn btn-gold" onClick={send} disabled={loading || !input.trim()}>إرسال ←</button>
            </div>
          )}
        </div>
        <div>
          <div className="card">
            <div className="sec-label">نصائح المقابلة</div>
            {[
              ["⏱", "القاعدة 90 ثانية", "لا تتجاوز دقيقة ونصف في أي إجابة"],
              ["📊", "أسلوب STAR", "الموقف، المهمة، الإجراء، النتيجة"],
              ["🔢", "استخدم أرقاماً", "«حسّنت المبيعات ٤٠٪» أقوى من «حسّنت المبيعات»"],
              ["🤝", "أسئلة للمحاور", "جهّز ٣ أسئلة ذكية للنهاية"],
            ].map(([icon, title, desc]) => (
              <div key={title} style={{ display: "flex", gap: 10, padding: "10px 0", borderBottom: "1px solid var(--border)" }}>
                <span style={{ fontSize: 16 }}>{icon}</span>
                <div><div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--text)", textTransform: "uppercase", letterSpacing: ".06em" }}>{title}</div><div style={{ fontSize: 12, color: "var(--text3)", marginTop: 3, lineHeight: 1.5 }}>{desc}</div></div>
              </div>
            ))}
          </div>
          {!isPro && (
            <div className="card card-gold mt12">
              <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--gold)", textTransform: "uppercase", letterSpacing: ".1em" }}>Pro: جلسات غير محدودة</div>
              <div style={{ fontSize: 13, color: "var(--text2)", marginTop: 6 }}>تقرير مفصل بعد كل جلسة + نقاط ضعفك الرئيسية</div>
              <button className="btn btn-gold btn-sm btn-full mt10" onClick={onUpgrade}>جرّب مجاناً ←</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

    { id: "dashboard", icon: "⬡", label: "لوحة التحكم" },

    { id: "interview", icon: "◉", label: "تدرب للمقابلة" },

          {isPro ? (
            <div style={{ margin: 12, padding: 12, background: "rgba(201,168,76,.08)", border: "1px solid rgba(201,168,76,.25)", borderRadius: 8, textAlign: "center" }}>
              <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--gold)", letterSpacing: ".15em", textTransform: "uppercase" }}>✓ Pro مفعّل</div>
              <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 8, color: "var(--text3)", marginTop: 4 }}>جميع الميزات متاحة</div>

}

        // تشغيل التطبيق داخل العنصر الأساسي
